version: 2
project_name: apiscribe
builds:
  - binary: apiscribe
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags: ["-s -w -X main.version={{.Version}}"]
archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files: [README.md, LICENSE]
checksum:
  name_template: checksums.txt
changelog:
  sort: asc
